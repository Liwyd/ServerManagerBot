services:
  servermanagerbot:
    image: liwyd/servermanagerbot:latest
    restart: always
    env_file:
      - .env
    network_mode: "host"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-servermanagerbot}"
      POSTGRES_USER: "${POSTGRES_USER:-smbuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      PGPORT: "${PGPORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    network_mode: "host"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smbuser} -d ${POSTGRES_DB:-servermanagerbot} -p ${PGPORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
