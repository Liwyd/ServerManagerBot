[tool.ruff]
line-length = 128

[project]
name = "ServerManagerBot"
version = "1.0.0"
description = "Telegram bot for managing Hetzner Cloud servers, snapshots, and primary IPs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.16.4",
    "asyncpg==0.30.0",
    "sqlalchemy[asyncio]==2.0.42",
    "python-dotenv>=1.0.0",
    "eiogram==2.0.1",
    "hcloud==2.5.4",
    "apscheduler>=3.11.0",
    "aiohttp>=3.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
]
