name: CI Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: servermanagerbot:test

      - name: Verify Docker Image
        run: |
          docker run --rm servermanagerbot:test sh -c "uv run python -c 'from src.config import SQLALCHEMY_DATABASE_URL; print(\"URL loaded OK\")'"
